name: assembly

on:
  push:
    branches: [main, bridge/integration, rel/v0.3.3-rc.2, rel/v0.3.4-rc.1]
  pull_request:
    branches: [main, bridge/integration]
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"
permissions:
  contents: read

concurrency:
  group: assembly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pinned-assembly:
    name: Pinned vendored assembly smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout MetaViewer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.12.3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"

      - name: Set up Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.0"
          check-latest: false
          cache: false

      - name: Parse deps.lock pins (require 40-hex commits)
        id: pins
        run: |
          set -euo pipefail
          python3 tools/assembly_smoke.py \
            --lock deps.lock \
            --github-output "${GITHUB_OUTPUT}" \
            --print-pins

      - name: Verify vendored assembly inputs against deps.lock
        run: python3 -B .github/workflows/vendored_assembly.py

      - name: Install pinned numpy for vision-engine
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir --only-binary=:all: numpy==2.4.2 Pillow

      - name: Run assembly smoke unit tests
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_assembly_smoke -v

      - name: Run real assembly smokes against pinned vendored trees
        run: |
          set -euo pipefail
          python3 -B .github/workflows/vendored_assembly.py --smoke --timeout 60
