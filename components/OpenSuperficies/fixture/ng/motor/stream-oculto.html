<!DOCTYPE html>
<!-- test double for U-11: fails A-04 when invisible confirmation (#stream display:none) reports rc 0 instead of rc 6 -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Superficie Fixture - Stream Oculto</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #f9f9f9; }
    #dropzone { border: 2px dashed #ccc; padding: 1rem; margin-bottom: 1rem; }
    #editor { width: 100%; height: 100px; }
    .chip { display: inline-block; padding: 4px 8px; background: #e0e0e0; border-radius: 4px; margin: 4px 0; }
  </style>
</head>
<body>
  <h1>Superficie Fixture - Stream Oculto</h1>
  <div id="dropzone">
    <input type="file" id="fileInput" style="display:none">
    <div id="chipContainer"></div>
  </div>
  <textarea id="editor" role="textbox" placeholder="Escriba su consulta..."></textarea>
  <br>
  <button id="submitBtn" type="submit" aria-label="Submit">Enviar</button>
  <div id="stream-container" style="display:none">
    <!-- Stream exists in DOM but is display:none (invisible confirmation) -->
    <div id="stream" style="display:none">Texto de stream oculto</div>
    <!-- Stop button has opacity:0 and is hidden -->
    <button id="stopBtn" style="display:none; opacity:0" aria-label="Stop">Detener</button>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const chipContainer = document.getElementById("chipContainer");
    const submitBtn = document.getElementById("submitBtn");

    fileInput.addEventListener("change", () => {
      chipContainer.innerHTML = "";
      if (fileInput.files.length > 0) {
        const f = fileInput.files[0];
        const chip = document.createElement("div");
        chip.className = 'chip';
        chip.innerText = f.name;
        chip.setAttribute("aria-label", f.name);
        chip.setAttribute("title", f.name);
        chipContainer.appendChild(chip);
      }
    });

    submitBtn.addEventListener("click", () => {
      // Submit accepted, but confirmation remains invisible:
      // #stream exists in the DOM but is display:none
    });
  </script>
</body>
</html>
