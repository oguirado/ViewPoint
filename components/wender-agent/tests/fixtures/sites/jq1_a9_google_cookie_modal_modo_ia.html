<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Búsqueda de Google - Replica</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .search-landmark { padding: 20px; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .dialog-box { background: #fff; margin: 100px auto; padding: 20px; width: 500px; }
    .hidden { display: none !important; }
    #btn-img-search { position: absolute; left: 1120px; top: 280px; width: 40px; height: 40px; }
    #link-modo-ia { position: absolute; left: 1170px; top: 280px; width: 88px; height: 40px; }
    @media (max-width: 780px) {
      #link-modo-ia { display: none; }
    }
  </style>
</head>
<body>
  <!-- S0 Dialog -->
  <div id="cookie-dialog" role="dialog" aria-label="Antes de ir a la Búsqueda de Google" class="modal-overlay">
    <div class="dialog-box">
      <h2>Antes de ir a la Búsqueda de Google</h2>
      <iframe srcdoc="<p>Challenge iframe</p>"></iframe>
      <button id="btn-reject-all">Rechazar todo</button>
    </div>
  </div>

  <!-- Background search landmark -->
  <div role="search" aria-label="Buscar" class="search-landmark">
    <button id="btn-img-search">Búsqueda por imágenes</button>
    <a id="link-modo-ia" href="#">Modo IA</a>
  </div>

  <!-- S2 AI Mode content -->
  <div id="ai-mode-container" class="hidden">
    <h2>¿Qué tienes en mente?</h2>
    <input type="text" role="combobox" aria-label="¿Qué tienes en mente?" placeholder="¿Qué tienes en mente?">
  </div>

  <script>
    document.getElementById('btn-reject-all').addEventListener('click', function() {
      document.getElementById('cookie-dialog').classList.add('hidden');
    });
    document.getElementById('link-modo-ia').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('ai-mode-container').classList.remove('hidden');
    });
  </script>
</body>
</html>
