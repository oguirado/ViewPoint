[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-engine"
version = "1.1.1"
description = "Deterministic integer-only vision engine for visual QA: tile classes, regions, judge pack, visual memory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = []

[project.scripts]
vcore = "visioncore.cli:main"

[tool.setuptools.packages.find]
include = ["visioncore*", "vmem*", "vadapt*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
visioncore = ["schemas/*.json"]
