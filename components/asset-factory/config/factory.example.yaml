# Required: false allows eligible noncommercial use, marked non-monetisable.
# Set true for commercial work; noncommercial providers/dependencies are refused.
# This is a user declaration, never inferred or defaulted by the checker.
# The explicit campaign operator declaration and its provenance are in factory.operator-1118.yaml.
schema: af.factory-config/v1
jurisdiction: ES
commercial_use: false
models_path: models
memory: {max_resident_models: 1, ceiling_gb_default: 40, min_free_gb_before_start: 20}
slots:
  generate: {provider: none}
  refine: {provider: none}
  topology: {provider: none}
  uv_texture: {provider: none}
  parts: {provider: none}
  rig: {provider: none}
  motion: {provider: none}
  render: {provider: none}
gates:
  appearance: {floor: 4, target: 7}
  vqa3d_profile: asset-intake

# For D18 matte intake, the trusted launcher supplies AF_FACTORY_CONFIG_SHA256
# (the SHA-256 of the exact JSON configuration passed to run_asset).
# matte_approval_store:
#   path: <absolute operator-owned approval-store JSON path>
#   sha256: <lowercase SHA-256 of the store bytes>
# The store uses af.matte-approval-store/v1 with an approvals array. Each entry
# has original_digest, selection_digest and intent_digest (sha256:-prefixed).
# Intent bytes are in matte-intent/<unprefixed intent SHA-256> beside the store.
