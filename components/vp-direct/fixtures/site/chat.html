<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture chat</title>
</head>
<body>
<h1>Fixture chat</h1>
<p>Chat-like page with a prompt box and a streamed answer. All answers
are synthetic and served locally.</p>
<form id="fixture-chat-form" action="#" method="post">
  <label>Prompt
    <textarea id="chat-prompt" name="prompt" rows="3" cols="48"></textarea>
  </label>
  <button type="submit" id="chat-send">Send</button>
</form>
<div id="chat-answer" aria-live="polite"></div>
<p data-fixture="chat-marker">FIXTURE_CHAT_OK</p>
<script>
  var ANSWER = "Synthetic streamed answer for fixture use only. ";
  document.getElementById("fixture-chat-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var box = document.getElementById("chat-answer");
    box.textContent = "";
    var i = 0;
    var timer = setInterval(function () {
      box.textContent += ANSWER.charAt(i % ANSWER.length);
      i += 1;
      if (i >= ANSWER.length * 2) { clearInterval(timer); }
    }, 20);
  });
</script>
</body>
</html>
