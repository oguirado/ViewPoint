  <circle cx="532" cy="260" r="4" fill="#6fe5c4"/>
  <text x="546" y="264" fill="#94a2af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1">WINDOW</text>
