  <text x="336" y="598" fill="#94a2af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">00:00.8  adapter     OpenSuperficies surface requested</text>
  <text x="336" y="620" fill="#94a2af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">00:01.4  window      capsule window mapped</text>
  <text x="336" y="642" fill="#f3a35c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">00:01.9  control     operator retains keyboard</text>
