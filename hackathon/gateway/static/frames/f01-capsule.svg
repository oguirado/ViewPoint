  <circle cx="732" cy="260" r="4" fill="#f3a35c"/>
  <text x="746" y="264" fill="#f3a35c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1">CAPSULE</text>
  <text x="732" y="286" fill="#ebe5d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">opening…</text>

  <rect x="312" y="322" width="570" height="180" rx="12" fill="#0f161e" stroke="#22303c"/>
