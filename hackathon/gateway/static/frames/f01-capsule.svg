  <rect x="500" y="405" width="280" height="6" rx="3" fill="#6fe5c4"/>
  <text x="336" y="444" fill="#94a2af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">surface create</text>
  <rect x="500" y="435" width="280" height="6" rx="3" fill="#1a2530"/>
  <rect x="500" y="435" width="176" height="6" rx="3" fill="#f3a35c"/>
  <text x="336" y="474" fill="#94a2af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">control lease</text>
  <rect x="500" y="465" width="280" height="6" rx="3" fill="#1a2530"/>
  <rect x="500" y="465" width="64" height="6" rx="3" fill="#bda7ff"/>
  <text x="808" y="380" text-anchor="end" fill="#6fe5c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">2 / 4 ready</text>

  <rect x="902" y="322" width="286" height="84" rx="12" fill="rgba(243,163,92,.08)" stroke="rgba(243,163,92,.3)"/>
  <text x="922" y="346" fill="#f3a35c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2">KEYBOARD OWNER</text>
  <text x="922" y="376" fill="#ebe5d9" font-family="Georgia, 'Times New Roman', serif" font-size="24">Operator</text>
  <text x="922" y="394" fill="#94a2af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">host desktop · editor active</text>

  <rect x="902" y="418" width="286" height="84" rx="12" fill="#111922" stroke="#22303c"/>
  <text x="922" y="442" fill="#94a2af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2">AGENT INPUT</text>
  <text x="922" y="472" fill="#ebe5d9" font-family="Georgia, 'Times New Roman', serif" font-size="24">Not granted</text>
  <text x="922" y="490" fill="#657381" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">login / handoff not complete</text>

  <rect x="312" y="522" width="876" height="126" rx="12" fill="#080d12" stroke="#18232d"/>
