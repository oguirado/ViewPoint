<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title desc">
  <title id="title">SAMPLE frame 1: capsule launch</title>
  <desc id="desc">Synthetic illustration. A ViewPoint capsule opens on the arm64 host while the operator keeps the keyboard. Not a real recording.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b10"/>
      <stop offset="1" stop-color="#0c141c"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3a35c"/>
      <stop offset="1" stop-color="#6fe5c4"/>
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2530" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg1)"/>
  <rect width="1280" height="720" fill="url(#grid1)" opacity="0.42"/>
  <circle cx="1160" cy="70" r="250" fill="#f3a35c" opacity="0.035"/>
  <circle cx="100" cy="680" r="220" fill="#6fe5c4" opacity="0.03"/>

