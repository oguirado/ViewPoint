  <text x="1000" y="76" text-anchor="end" fill="#6fe5c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.2">LOCAL · ARM64</text>
  <rect x="1030" y="58" width="72" height="26" rx="13" fill="rgba(255,133,133,.08)" stroke="#ff8585" stroke-dasharray="4 3"/>
  <text x="1066" y="75" text-anchor="middle" fill="#ffb9b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="bold" letter-spacing="1.3">SAMPLE</text>

  <rect x="56" y="94" width="220" height="578" fill="#0b1117"/>
  <line x1="276" y1="94" x2="276" y2="672" stroke="#18232d"/>
  <text x="84" y="132" fill="#657381" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.6">WORKSPACE</text>
  <rect x="72" y="150" width="188" height="36" rx="8" fill="rgba(243,163,92,.1)" stroke="rgba(243,163,92,.25)"/>
