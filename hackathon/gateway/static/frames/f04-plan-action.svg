  <text x="104" y="400" fill="#6fe5c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8">recorded step s05 · matches replay</text>

  <text x="104" y="440" fill="#ebe5d9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">02  Run a search</text>
  <text x="104" y="460" fill="#94a2af" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11">Collect cited source links; do not invent results</text>
  <text x="104" y="490" fill="#6fe5c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8">recorded step s06 · matches replay</text>

  <text x="104" y="530" fill="#ebe5d9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">03  Observe Gemini Deep Research</text>
  <text x="104" y="550" fill="#94a2af" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11">Record the pending state; completion is not claimed</text>
  <text x="104" y="580" fill="#f3a35c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8">recorded step s07 · pending</text>

  <text x="104" y="620" fill="#ebe5d9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">04  Return control</text>
  <text x="104" y="640" fill="#94a2af" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11">Verify refusal, then stop and restart cleanly</text>

