<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title desc">
  <title id="title">SAMPLE frame 4: Gemini plan beside recorded browser actions</title>
  <desc id="desc">Synthetic illustration. A Gemini plan panel sits beside a search result with cited source cards. Not a real recording or a real source link.</desc>
