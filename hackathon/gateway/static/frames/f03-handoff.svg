  <text x="932" y="326" fill="#f3a35c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">HOST EDITOR</text>
  <text x="932" y="348" fill="#94a2af" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">active · focus not stolen</text>

  <text x="916" y="406" fill="#657381" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2">BOUNDARY</text>
  <text x="916" y="432" fill="#94a2af" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Cloud transport cannot</text>
  <text x="916" y="450" fill="#94a2af" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">override local ownership.</text>
  <line x1="916" y1="476" x2="1156" y2="476" stroke="#18232d"/>
  <text x="916" y="502" fill="#657381" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2">NEXT</text>
  <text x="916" y="528" fill="#ebe5d9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">Engine acts on a named target,</text>
  <text x="916" y="548" fill="#ebe5d9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">then observes the result.</text>
  <text x="916" y="590" fill="#b08d7f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">SAMPLE — synthetic handoff</text>

