  <text x="122" y="476" fill="#94a2af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">03  repeat in Gemini and observe Deep Research state</text>
  <text x="122" y="500" fill="#94a2af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">04  verify each outcome, then return control to the operator</text>

